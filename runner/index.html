<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Раннер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #1b1d2a; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; padding: 8px 0; box-sizing: border-box; }
    #wrap { width: 100%; max-width: 800px; }
    #stage { position: relative; }
    canvas { width: 100%; display: block; background: #f4f1de; touch-action: none; user-select: none; }
    p { color: #8b90ad; font: 13px sans-serif; text-align: center; margin: 10px 8px 0; }
    .hidden { display: none !important; }

    #revive {
      position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
      border: 0; border-radius: 12px; background: #7b5cff; color: #fff;
      font: bold 16px sans-serif; padding: 12px 20px; box-shadow: 0 4px 0 #5238c9;
    }
    #revive:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #5238c9; }
    #revive:disabled { opacity: .5; }
    #msg { position: absolute; left: 0; right: 0; top: 8px; text-align: center; color: #3a3a3a; font: 14px sans-serif; }

    #setup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 8px 0; }
    .card { background: #262a3d; border-radius: 12px; padding: 10px; display: flex; gap: 10px; align-items: center; color: #e6e8f5; font: 13px sans-serif; }
    .card img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: #3a3f5a; flex: none; }
    .card .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .card b { font-size: 14px; }
    .card .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .pick, .card button {
      border: 0; border-radius: 8px; background: #7b5cff; color: #fff; font: 600 12px sans-serif;
      padding: 6px 10px; cursor: pointer;
    }
    .card button { background: #3a3f5a; }

    .demo-ad { position: fixed; inset: 0; background: #111; color: #fff; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font: 16px sans-serif; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="c" width="800" height="300"></canvas>
      <button id="revive" class="hidden" type="button">📺 Воскреснуть (реклама)</button>
      <div id="msg" class="hidden"></div>
    </div>

    <div id="setup">
      <div class="card">
        <img id="prev-player" alt="">
        <div class="col">
          <b>Ты</b>
          <div class="btns">
            <label class="pick">Фото<input type="file" accept="image/*" data-slot="player" hidden></label>
            <button type="button" data-clear="player">Сброс</button>
          </div>
        </div>
      </div>
      <div class="card">
        <img id="prev-target" alt="">
        <div class="col">
          <b>Кого догоняем</b>
          <div class="btns">
            <label class="pick">Фото<input type="file" accept="image/*" data-slot="target" hidden></label>
            <button type="button" data-clear="target">Сброс</button>
          </div>
        </div>
      </div>
    </div>

    <p>Прыжок: тап по верху / Пробел / ↑ &nbsp;·&nbsp; Присесть: зажать низ экрана / ↓</p>
    <p>Фото хранятся только на твоём устройстве и никуда не отправляются.</p>
  </div>

<script src="../config.js"></script>
<script>
"use strict";

// ───────────── Telegram ─────────────
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = (k) => { try { tg && tg.HapticFeedback.impactOccurred(k); } catch (_) {} };

// ───────────── Настройки ─────────────
// На узком экране (телефон) делаем поле выше и уже, чтобы персонажи не выглядели крошечными
const NARROW = window.innerWidth < 600;
const W = NARROW ? 560 : 800, H = NARROW ? 400 : 300, GROUND = H - 50;
const GRAVITY = 2400, JUMP_V = -820, FAST_FALL = 2.2;
const SPEED_START = 320, SPEED_MAX = 760, SPEED_GROWTH = 0.1;
const SPRITE_W = 48, SPRITE_H = 60, DUCK_H = 32;
const TARGET_SIZE = 100;
const PHOTO_PX = 128; // сторона сохраняемого квадрата

// Block ID из кабинета Adsgram (partner.adsgram.ai). Пусто = демо-режим с фейковой рекламой.
const ADSGRAM_BLOCK_ID = (window.APP_CONFIG && window.APP_CONFIG.ADSGRAM_BLOCK_ID) || "";
const REVIVE_INVULN_SEC = 2;
const REVIVE_CLEAR_PX = 450; // сколько пикселей впереди очищается от препятствий

const cv = document.getElementById("c");
cv.width = W;
cv.height = H;
const ctx = cv.getContext("2d");

// ───────────── Фото игрока и цели ─────────────
const imgs = { player: null, target: null };
const previews = { player: document.getElementById("prev-player"), target: document.getElementById("prev-target") };
const store = {
  get: (k) => { try { return localStorage.getItem("runner_" + k); } catch (_) { return null; } },
  set: (k, v) => { try { localStorage.setItem("runner_" + k, v); } catch (_) {} },
  del: (k) => { try { localStorage.removeItem("runner_" + k); } catch (_) {} },
};

function applyPhoto(slot, dataUrl) {
  if (!dataUrl) {
    imgs[slot] = null;
    previews[slot].removeAttribute("src");
    return;
  }
  const im = new Image();
  im.onload = () => { imgs[slot] = im; previews[slot].src = dataUrl; };
  im.src = dataUrl;
}

// Обрезаем по центру до квадрата и уменьшаем, чтобы в хранилище лежало несколько КБ
async function photoToDataUrl(file) {
  const bmp = await createImageBitmap(file);
  const side = Math.min(bmp.width, bmp.height);
  const c = document.createElement("canvas");
  c.width = c.height = PHOTO_PX;
  c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, PHOTO_PX, PHOTO_PX);
  bmp.close && bmp.close();
  return c.toDataURL("image/jpeg", 0.85);
}

document.querySelectorAll("input[type=file]").forEach((input) => {
  input.addEventListener("change", async () => {
    const file = input.files && input.files[0];
    const slot = input.dataset.slot;
    input.value = "";
    if (!file) return;
    try {
      const url = await photoToDataUrl(file);
      store.set(slot, url);
      applyPhoto(slot, url);
      haptic("light");
    } catch (_) {
      say("Не удалось открыть фото, попробуй другое");
    }
  });
});
document.querySelectorAll("button[data-clear]").forEach((b) => {
  b.addEventListener("click", () => {
    const slot = b.dataset.clear;
    store.del(slot);
    applyPhoto(slot, null);
    b.blur();
  });
});
applyPhoto("player", store.get("player"));
applyPhoto("target", store.get("target"));

// Рисует фото, обрезая по центру под нужное соотношение сторон, со скруглением
function drawPhoto(im, x, y, w, h, r) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.clip();
  const k = Math.max(w / im.width, h / im.height);
  const sw = w / k, sh = h / k;
  ctx.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, w, h);
  ctx.restore();
}

// ───────────── Состояние ─────────────
let state = "ready"; // ready | run | over
let player, obstacles, speed, score, distance, spawnIn, hi, t;
let revived = false, adBusy = false;
const reviveBtn = document.getElementById("revive");
const msgEl = document.getElementById("msg");
try { hi = +localStorage.getItem("runner_hi") || 0; } catch (_) { hi = 0; }

function reset() {
  player = { x: 70, feet: GROUND, vy: 0, duck: false, ground: true, invuln: 0 };
  obstacles = [];
  speed = SPEED_START;
  score = 0;
  distance = 0;
  spawnIn = 500;
  t = 0;
  revived = false;
  reviveBtn.classList.add("hidden");
}
reset();

const playerH = () => (player.duck && player.ground ? DUCK_H : SPRITE_H);
const playerBox = () => ({ x: player.x + 6, y: player.feet - playerH() + 4, w: SPRITE_W - 12, h: playerH() - 6 });

// Расстояние до цели: всегда уменьшается, но никогда не доходит до нуля
const gapMeters = () => Math.max(1, Math.round(1000 / (1 + score / 150)));

// ───────────── Ввод ─────────────
function jump() {
  if (state !== "run") { start(); return; }
  if (player.ground) {
    player.vy = JUMP_V;
    player.ground = false;
    haptic("light");
  }
}
function start() {
  if (adBusy) return;
  if (state === "over" && t < 0.4) return; // защита от случайного рестарта
  reset();
  state = "run";
}
function setDuck(v) { player.duck = v; }

addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.target.closest && e.target.closest("#setup")) return;
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) { e.preventDefault(); jump(); }
  if (["ArrowDown", "KeyS"].includes(e.code)) { e.preventDefault(); if (state !== "run") start(); else setDuck(true); }
});
addEventListener("keyup", (e) => {
  if (["ArrowDown", "KeyS"].includes(e.code)) setDuck(false);
});

// Тач/мышь: нижняя треть — присесть (удерживая), остальное — прыжок
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const lower = (e.clientY - r.top) / r.height > 0.66;
  if (state !== "run") { start(); return; }
  if (lower) setDuck(true); else jump();
});
const release = () => setDuck(false);
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.addEventListener("pointerleave", release);

// ───────────── Логика ─────────────
function spawn() {
  const birdsAllowed = score > 250;
  if (birdsAllowed && Math.random() < 0.35) {
    // Птица на уровне головы стоящего: пробежать нельзя — надо присесть или перепрыгнуть
    obstacles.push({ type: "bird", x: W + 20, w: 46, h: 26, y: GROUND - 34 - 26, flap: 0 });
  } else {
    const n = Math.random() < 0.3 ? 2 : 1; // иногда двойной кактус
    const w = 22 * n + (n - 1) * 6;
    const h = 40 + Math.random() * 28;
    obstacles.push({ type: "cactus", x: W + 20, w, h, y: GROUND - h, n });
  }
  spawnIn = speed * (0.85 + Math.random() * 0.8) + 120;
}

const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function update(dt) {
  t += dt;
  if (state !== "run") return;

  speed = Math.min(SPEED_MAX, SPEED_START + score * SPEED_GROWTH);
  distance += speed * dt;
  score = distance / 10;

  // Физика игрока
  if (!player.ground) {
    player.vy += GRAVITY * (player.duck ? FAST_FALL : 1) * dt;
    player.feet += player.vy * dt;
    if (player.feet >= GROUND) { player.feet = GROUND; player.vy = 0; player.ground = true; }
  }

  // Препятствия
  spawnIn -= speed * dt;
  if (spawnIn <= 0) spawn();
  for (const o of obstacles) {
    o.x -= speed * dt;
    if (o.type === "bird") o.flap += dt * 10;
  }
  obstacles = obstacles.filter((o) => o.x + o.w > -20);

  const pb = playerBox();
  if (player.invuln > 0) player.invuln -= dt;
  else if (obstacles.some((o) => hit(pb, o))) gameOver();
}

// ───────────── Воскрешение за рекламу ─────────────
function showRewardedAd() {
  if (window.Adsgram && ADSGRAM_BLOCK_ID) {
    const controller = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    // resolve — досмотрел до конца; reject — пропустил, нет рекламы или ошибка
    return controller.show().then(() => true, () => false);
  }
  return demoAd();
}

// Демо-режим для локальной разработки, когда blockId не задан
function demoAd() {
  return new Promise((resolve) => {
    const d = document.createElement("div");
    d.className = "demo-ad";
    d.innerHTML = '<div style="font-size:48px">📺</div><div>Демо-реклама (задайте ADSGRAM_BLOCK_ID)</div><div class="left"></div>';
    document.body.appendChild(d);
    let left = 3;
    const tick = () => {
      d.querySelector(".left").textContent = "Награда через " + left + " c";
      if (left-- <= 0) { d.remove(); resolve(true); } else setTimeout(tick, 1000);
    };
    tick();
  });
}

function say(text) {
  msgEl.textContent = text;
  msgEl.classList.remove("hidden");
  setTimeout(() => msgEl.classList.add("hidden"), 2200);
}

async function revive() {
  if (adBusy || state !== "over" || revived) return;
  adBusy = true;
  reviveBtn.disabled = true;
  try {
    const ok = await showRewardedAd();
    if (!ok) { say("Реклама недоступна или пропущена — воскрешения нет"); return; }
    revived = true;
    reviveBtn.classList.add("hidden");
    obstacles = obstacles.filter((o) => o.x > player.x + REVIVE_CLEAR_PX);
    spawnIn = Math.max(spawnIn, 400);
    Object.assign(player, { feet: GROUND, vy: 0, ground: true, duck: false, invuln: REVIVE_INVULN_SEC });
    state = "run";
    haptic("medium");
  } finally {
    adBusy = false;
    reviveBtn.disabled = false;
  }
}
reviveBtn.addEventListener("click", revive);

function gameOver() {
  state = "over";
  t = 0;
  haptic("heavy");
  if (!revived) reviveBtn.classList.remove("hidden");
  if (score > hi) {
    hi = score;
    try { localStorage.setItem("runner_hi", String(Math.floor(hi))); } catch (_) {}
  }
}

// ───────────── Отрисовка ─────────────
function drawPlayer() {
  if (player.invuln > 0 && Math.floor(t * 12) % 2) return; // мигание при неуязвимости
  const h = playerH();
  const x = player.x, y = player.feet - h;
  const duck = player.duck && player.ground;

  if (imgs.player) {
    drawPhoto(imgs.player, x, y, SPRITE_W, h, 10);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, SPRITE_W - 2, h - 2);
    return;
  }

  // Запасной персонаж, пока фото не загружено
  ctx.fillStyle = "#3d5a80";
  ctx.fillRect(x, y, SPRITE_W, h);
  ctx.fillStyle = "#fff";
  ctx.fillRect(x + SPRITE_W - 18, y + 6, 10, 10);
  ctx.fillStyle = "#111";
  ctx.fillRect(x + SPRITE_W - 12, y + 9, 5, 5);
  if (!duck) {
    ctx.fillStyle = "#293241";
    const step = player.ground && state === "run" ? Math.floor(t * 12) % 2 : 0;
    ctx.fillRect(x + 8, y + h - 2, 10, step ? 2 : 6);
    ctx.fillRect(x + 28, y + h - 2, 10, step ? 6 : 2);
  }
}

// Цель летит справа и постепенно «приближается», но игрок её не догонит
function drawTarget() {
  const close = 120 * (1 - 1 / (1 + score / 400)); // 0..120 px
  const x = W - TARGET_SIZE - 40 - close + Math.sin(t * 1.3) * 6;
  const y = GROUND - TARGET_SIZE - 70 + Math.sin(t * 3) * 12;
  const r = TARGET_SIZE / 2;
  const cx = x + r, cy = y + r;

  // Полоски скорости слева
  ctx.strokeStyle = "rgba(58,58,58,.35)";
  ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const ly = cy - 20 + i * 20;
    const len = 30 + ((Math.floor(t * 10) + i) % 3) * 10;
    ctx.beginPath();
    ctx.moveTo(x - 6, ly);
    ctx.lineTo(x - 6 - len, ly);
    ctx.stroke();
  }

  // Крылышки
  const flap = Math.sin(t * 14) * 8;
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "#c9c4a8";
  ctx.lineWidth = 2;
  for (const dir of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + dir * (r + 8), cy - 10 - flap * 0.7, 20, 10 + Math.abs(flap) * 0.6, dir * -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // Сам спрайт: круг
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  if (imgs.target) {
    ctx.drawImage(imgs.target, x, y, TARGET_SIZE, TARGET_SIZE);
  } else {
    ctx.fillStyle = "#f2c14e";
    ctx.fillRect(x, y, TARGET_SIZE, TARGET_SIZE);
    ctx.fillStyle = "#3a3a3a";
    ctx.font = "bold 56px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("?", cx, cy + 20);
  }
  ctx.restore();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawObstacle(o) {
  if (o.type === "cactus") {
    ctx.fillStyle = "#2d6a4f";
    const cw = 22;
    for (let i = 0; i < o.n; i++) {
      const cx = o.x + i * (cw + 6);
      ctx.fillRect(cx + 7, o.y, 8, o.h);
      ctx.fillRect(cx, o.y + o.h * 0.35, 8, 6);
      ctx.fillRect(cx, o.y + o.h * 0.2, 6, o.h * 0.2);
      ctx.fillRect(cx + 14, o.y + o.h * 0.5, 8, 6);
      ctx.fillRect(cx + 16, o.y + o.h * 0.3, 6, o.h * 0.25);
    }
  } else {
    const up = Math.sin(o.flap) > 0;
    ctx.fillStyle = "#6d4c41";
    ctx.fillRect(o.x + 8, o.y + 8, 30, 12);
    ctx.fillRect(o.x, o.y + 10, 10, 6);
    ctx.fillStyle = "#8d6e63";
    ctx.fillRect(o.x + 16, up ? o.y - 2 : o.y + 18, 16, 10);
    ctx.fillStyle = "#fff";
    ctx.fillRect(o.x + 4, o.y + 10, 3, 3);
  }
}

function draw() {
  ctx.fillStyle = "#f4f1de";
  ctx.fillRect(0, 0, W, H);

  // Земля со «скроллом»
  ctx.fillStyle = "#3a3a3a";
  ctx.fillRect(0, GROUND, W, 2);
  ctx.fillStyle = "#9a9a9a";
  const off = distance % 60;
  for (let x = -off; x < W; x += 60) {
    ctx.fillRect(x + 10, GROUND + 10, 14, 2);
    ctx.fillRect(x + 38, GROUND + 22, 8, 2);
  }

  drawTarget();
  obstacles.forEach(drawObstacle);
  drawPlayer();

  // Счёт и расстояние до цели
  ctx.fillStyle = "#3a3a3a";
  ctx.font = "bold 20px monospace";
  ctx.textAlign = "right";
  ctx.fillText("HI " + String(Math.floor(hi)).padStart(5, "0") + "  " + String(Math.floor(score)).padStart(5, "0"), W - 14, 28);
  ctx.textAlign = "left";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("До цели: " + gapMeters() + " м", 14, 28);

  ctx.textAlign = "center";
  if (state === "ready") {
    ctx.font = "bold 26px sans-serif";
    ctx.fillText("Догони его! Тап — старт", W / 2 - 40, 110);
  } else if (state === "over") {
    ctx.font = "bold 34px sans-serif";
    ctx.fillText("Почти догнал!", W / 2, 90);
    ctx.font = "18px sans-serif";
    ctx.fillText("Осталось " + gapMeters() + " м. Тап — ещё раз", W / 2, 124);
  }
}

// ───────────── Цикл ─────────────
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
