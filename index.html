<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Игры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #1b1d2a; --card: #262a3d; --text: #e6e8f5; --muted: #8b90ad; --accent: #7b5cff; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    a.game, .game {
      display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 16px; padding: 16px;
      margin-bottom: 12px; text-decoration: none; color: inherit; border: 2px solid transparent; position: relative;
    }
    a.game:active { transform: scale(.98); border-color: var(--accent); }
    .icon { font-size: 40px; width: 56px; text-align: center; flex: none; }
    .info b { font-size: 17px; display: block; margin-bottom: 2px; }
    .info span { font-size: 13px; color: var(--muted); }
    .go { margin-left: auto; font-size: 22px; color: var(--accent); }
    .locked { opacity: .6; }
    .locked .go { color: var(--muted); }
    .badge { position: absolute; top: 10px; right: 12px; background: #3a3f5a; color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 8px; }
    .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,.85); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Выбери игру</h1>
    <p class="sub">Играй и зови друзей</p>

    <a class="game" href="runner/">
      <div class="icon">🏃</div>
      <div class="info"><b>Раннер: Догони его!</b><span>Прыгай, приседай и не догоняй</span></div>
      <div class="go">▶</div>
    </a>

    <div class="game locked" id="farm" role="button" tabindex="0">
      <div class="icon">🔒</div>
      <div class="info"><b>Ферма</b><span>Строй и прокачивай хозяйство</span></div>
      <div class="badge">В разработке</div>
    </div>
  </main>
  <div class="toast" id="toast">Ферма ещё в разработке 🚧</div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const toast = document.getElementById("toast");
    document.getElementById("farm").addEventListener("click", () => {
      toast.classList.add("show");
      try { tg && tg.HapticFeedback.notificationOccurred("warning"); } catch (_) {}
      setTimeout(() => toast.classList.remove("show"), 1800);
    });
  </script>
</body>
</html>
